spring.application.name=backend-academico
server.port=8080
spring.profiles.default=jpa
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academico}
spring.datasource.username=${DB_USER:academico}
spring.datasource.password=${DB_PASSWORD:academico}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
spring.cache.type=simple
calendario.base-url=${CALENDARIO_URL:https://calendario.example}

management.endpoint.health.roles=ADMIN
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
